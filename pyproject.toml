[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engrama"
version = "0.5.0"
description = "ENGRAMA V5: Non-Attention Autoregressive Neural Architecture — isolated encoding, explicit circular trace, and content-addressable synaptic-resonance recall (no attention, no compression). Pure PyTorch."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Gerson Fabian Buenahora Ormaza (BUEORM)" }
]
license = { text = "AGPL-3.0-or-later" }
keywords = [
  "deep-learning",
  "pytorch",
  "neural-networks",
  "autoregressive",
  "non-attention",
  "engrama",
  "nlp",
  "sequence-modeling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/bueormnew/engrama"
Repository = "https://github.com/bueormnew/engrama"
Issues = "https://github.com/bueormnew/engrama/issues"

[project.scripts]
engrama = "engrama.cli:main"
engramacli = "engrama.cli:main"
engrama-ddp = "engrama.ddp_train:main"

[tool.setuptools.packages.find]
where = ["src"]
