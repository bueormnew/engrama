[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engrama"
version = "0.1.0"
description = "ENGRAMA: Non-Attention Autoregressive Neural Architecture with Isolated Encoding, Circular Trace, Dilated Causal Relative Consolidation & Multi-Candidate Evocation"
readme = "README.md"
authors = [
  { name = "BUEORM" }
]
license = { text = "AGPL-3.0-or-later" }
keywords = [
  "deep-learning",
  "pytorch",
  "neural-networks",
  "autoregressive",
  "non-attention",
  "engrama",
  "nlp",
  "sequence-modeling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark",
]

[project.urls]
Homepage = "https://github.com/BUEORM/ENGRAMA"
Repository = "https://github.com/BUEORM/ENGRAMA"
Issues = "https://github.com/BUEORM/ENGRAMA/issues"

[project.scripts]
engrama = "engrama.cli:main"
engramacli = "engrama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
